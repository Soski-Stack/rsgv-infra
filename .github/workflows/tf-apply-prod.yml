name: Terraform Apply — Production

on:
  push:
    branches: [main]

concurrency:
  group: "terraform-apply-prod"
  cancel-in-progress: true

env:
  TF_VERSION: "1.7.0"
  GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY_PROD }}

jobs:
  apply-prod:
    name: Apply to Production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        run: terraform init
      - name: Remove stale Terraform lock (if any)
        run: |
          gsutil -q stat gs://rsgv-tfstate-prod/infra/prod/*.tflock \
            && gsutil rm gs://rsgv-tfstate-prod/infra/prod/*.tflock \
            || true
      - name: Terraform Apply
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ secrets.GCP_REGION }}
          TF_VAR_vpc_network_name: ${{ secrets.VPC_NETWORK_NAME }}
          TF_VAR_cloud_sql_instance_name: ${{ secrets.CLOUD_SQL_INSTANCE_NAME_PROD }}
          TF_VAR_service_account_email: ${{ secrets.SA_EMAIL }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD_PROD }}
        run: terraform apply -auto-approve
