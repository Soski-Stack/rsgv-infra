name: Terraform Plan

on:
  pull_request:
    branches: [develop, main]

env:
  TF_VERSION: "1.7.0"
  GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

jobs:
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        run: terraform init
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="vpc_network_name=${{ secrets.VPC_NETWORK_NAME }}" \
            -var="service_account_email=${{ secrets.SA_EMAIL }}" \
            -var="db_password=PLACEHOLDER" \
            -no-color
